[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-tools-v3"
version = "3.0.0a1"
description = "A small FreeCAD execution, observation and Git snapshot toolkit for agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/liwuzhan/cad-tool"

[project.scripts]
cad3 = "cad3.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cad3 = ["data/*.json", "data/catalog/*.json", "data/catalog/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
